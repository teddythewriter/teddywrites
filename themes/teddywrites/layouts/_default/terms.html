{{ define "main" }}
<main id="main-content" class="site-main page-shell explore-page">
  <header class="page-header"><p class="marked-label">Find your way in</p><h1>Follow a thread</h1><p class="page-deck">The ideas that recur across the archive.</p></header>
  <div class="pill-row">{{ range .Data.Terms.ByCount }}<a class="pill" href="{{ .Page.RelPermalink }}"><span>{{ .Page.Title | lower }}</span><small>{{ .Count }}</small></a>{{ end }}</div>
</main>
{{ end }}
