{{ define "main" }}
<main id="main-content" class="site-main page-shell archive-page">
  <div class="list-column">
  <header class="page-header"><a class="back-link" href="{{ "tags/" | relLangURL }}">← All themes</a><p class="marked-label">{{ len .Pages }} {{ if eq (len .Pages) 1 }}entry{{ else }}entries{{ end }} on this thread</p><h1>{{ .Title }}</h1></header>
  {{ partial "entry-list.html" (dict "pages" .Pages) }}
  </div>
</main>
{{ end }}
