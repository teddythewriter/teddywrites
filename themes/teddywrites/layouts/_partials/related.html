{{- $related := .Site.RegularPages.Related . -}}
{{- $related = where $related "Section" .Section -}}
{{- $related = first 3 $related -}}
{{- with $related }}
<aside class="related-writing" aria-labelledby="related-title">
  <h2 id="related-title">Along the same thread</h2>
  <div class="card-grid">{{ range . }}<a class="card" href="{{ .RelPermalink }}"><span class="label">{{ .Date.Format "2006" }}</span><span class="card-title">{{ .Title }}</span>{{ with .Description }}<span class="card-text">{{ . }}</span>{{ end }}</a>{{ end }}</div>
</aside>
{{- end }}
