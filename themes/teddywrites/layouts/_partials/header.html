<header class="site-header">
  <div class="header-inner">
    <a class="site-brand" href="{{ "" | relLangURL }}" aria-label="{{ .Site.Title }} home">{{ .Site.Title }}</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"><span></span><span></span><span></span><span class="sr-only">Menu</span></button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
      {{ range .Site.Menus.main }}<a href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
    </nav>
  </div>
</header>
