<aside class="ambient-player" aria-label="Reading ambience" hidden>
  <button type="button" class="icon-button ambient-toggle" aria-pressed="false" aria-label="Play rain" title="Play rain">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17.2 8.1 3.5 3.5 0 0 1 17.5 15"></path><path d="M8 18.5v2M12 17.5v3.5M16 18.5v2"></path></svg>
  </button>
  <div class="ambient-controls">
    <label class="sr-only" for="ambient-volume">Rain volume</label>
    <input id="ambient-volume" type="range" min="0" max="100" value="20" aria-valuetext="20 percent">
    <a class="ambient-credit" href="https://opengameart.org/content/rain-loopable" target="_blank" rel="noopener noreferrer" aria-label="Rain recording by Ylmir, CC0 (opens in new tab)">Credits</a>
  </div>
  <span class="sr-only" role="status" id="ambient-status"></span>
  <audio id="ambient-audio" loop preload="none"><source src="{{ "audio/rain.mp3" | relURL }}" type="audio/mpeg"></audio>
</aside>
{{ $css := resources.Get "css/ambient.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
{{ $js := resources.Get "js/ambient.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
