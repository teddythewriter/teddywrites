{{ define "main" }}
<main id="main-content" class="site-main page-shell archive-page">
  <header class="page-header"><p class="marked-label">Read in order</p><h1>{{ .Title }}</h1>{{ with .Content }}<div class="page-deck">{{ . }}</div>{{ end }}</header>
  <div class="card-grid">
    {{ range .RegularPages.ByTitle }}<a class="card" href="{{ .RelPermalink }}">{{ with .Params.seriesStatus }}<span class="tone-label">{{ . }}</span>{{ end }}<span class="card-title">{{ .Title }}</span>{{ with .Description }}<span class="card-text">{{ . }}</span>{{ end }}</a>{{ end }}
  </div>
</main>
{{ end }}
