baseURL = "https://teddythewriter.github.io/teddywrites/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
theme = "teddywrites"

title = 'teddywrites'

[languages.en.params]
  homeSubtitle = "If I were to write everything that's in my mind, I'd lose it quite easily."

locale = "en-US"

pygmentsCodefences  = true
pygmentsUseClasses  = true

rssLimit = 10

copyright = "teddywrites"
enableEmoji = true

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", ":git", "date", "publishDate"]
  publishDate = ["publishDate", "date"]
  expiryDate = ["expiryDate"]

[params.author]
  name = "Teddy"
  about = "about"

[taxonomies]
  tag = "tags"

[related]
  includeNewer = true
  threshold = 70
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "date"
    weight = 10

[params]
  description = "Short fiction, personal reflections, and fragments by Teddy."
  images = ["og.png"]

  [params.assets]
    favicon = "favicon-96x96.png"

  [params.schema]
    publisherType = "Person"

[menu]

  [[menu.main]]
    identifier = "stories"
    name = "Stories"
    url = "stories/"
    weight = 10

  [[menu.main]]
    identifier = "fragments"
    name = "Fragments"
    url = "fragments/"
    weight = 11

  [[menu.main]]
    identifier = "letters"
    name = "Letters"
    url = "letters/"
    weight = 12

  [[menu.main]]
    identifier = "serial"
    name = "Serial"
    url = "series/"
    weight = 13

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "about/"
    weight = 20

# Expose static images to Hugo Pipes so story artwork can be resized to WebP.
# Declaring any mount replaces the defaults, so the standard ones are restated.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
